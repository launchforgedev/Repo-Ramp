
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reporamp"
version = "0.1.1"
description = "A developer tool for understanding Python codebases"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
     "typer>=0.12,<1.0",
     "tomli>=1.1; python_version < '3.11'",
]
[project.urls]
Homepage = "https://github.com/launchforgedev/Repo-Ramp"
Repository = "https://github.com/launchforgedev/Repo-Ramp"
Issues = "https://github.com/launchforgedev/Repo-Ramp/issues"
PyPI = "https://pypi.org/project/reporamp/"

[project.scripts]
reporamp = "reporamp.cli:app"


[project.optional-dependencies]
ai = [
    "anthropic>=2.0",
]
mcp = [
    "mcp>=2.0,<3",
]
dev = [
    "pytest",
    "ruff",
    "mcp>=2.0,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/reporamp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.ruff.format]
quote-style = "double"
